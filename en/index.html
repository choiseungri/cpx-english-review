<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f5f1e7"><meta name="description" content="CPX Practice Lab is an educational workbench for practicing Korean-language clinical interviews with authored fictional cases, reviewing quoted dialogue evidence and practicing again with a specific goal. An independent project by CHOI JUNHO · Started February 2026."><link rel="icon" type="image/svg+xml" href="./assets/favicon.svg"><title>CPX Practice Lab · From cases to questions and evidence</title><link rel="stylesheet" href="./style.css"><link rel="stylesheet" href="../guided-demo/style.css"><link rel="stylesheet" href="../project-front/style.css"></head><body><a class="skip" href="#main">Skip to content</a><header class="is-project-header"><a class="brand" href="#project">CPX Practice Lab</a><nav class="workbench-nav" aria-label="Main navigation"><button data-nav="project">Project</button><button data-nav="practice">Practice</button><button data-nav="review">Review</button><button data-nav="editor">Cases</button><button data-nav="about">Records & guide</button></nav><nav class="project-reviewer-nav" aria-label="Project sections"><a href="#overview">Overview</a><a href="#project-demo">Demo</a><a href="#why-claude">Why Claude</a><button data-nav="practice">Practice</button></nav><div class="locale-switch" aria-label="Language"><a data-language="en" lang="en" hreflang="en" href="../en/index.html" aria-current="page">English</a><a data-language="ko" lang="ko" hreflang="ko" href="../site/index.html">&#54620;&#44397;&#50612;</a></div></header><div id="notice" role="status" aria-live="polite"></div><main id="main" tabindex="-1"><noscript><style>header nav{display:none}</style><article class="project-page static-project" aria-label="Project introduction"><h1>CPX Practice Lab</h1><p>CPX Practice Lab is an educational workbench for practicing Korean-language clinical interviews with authored fictional cases, reviewing quoted dialogue evidence and practicing again with a specific goal.</p><section class="project-identity"><h2>Current workflow</h2><div class="identity-body"><p>3 authored fictional cases · 54 facts · 36 question intents · 108 expressions</p><p>Author a case → practice an interview → review quoted dialogue evidence → retry with a goal. The case version used for a practice session is preserved. Cases, drafts, conversations and goals can be exported or imported as JSON.</p></div></section><section class="project-identity"><h2>Creator</h2><div class="identity-body"><h3>CHOI JUNHO</h3><p>Independent creator in South Korea</p><p>Project started February 2026</p><p>An independent Korean-language clinical-interview practice project by CHOI JUNHO in South Korea. Started in February 2026, it connects case authoring, interview practice and review of quoted dialogue evidence in one workflow.</p></div></section><section class="project-identity"><h2>Development plans</h2><div class="identity-body"><p>CLAUDE / PLANNED</p><p>The next development step is to integrate Claude, connecting natural-language questions in Korean with case-grounded dialogue and review.</p><ol class="identity-plan"><li><h3>From Korean questions to patient responses</h3><p>The plan is to interpret the intent of natural-language questions in Korean and generate patient responses within the facts authored for the selected case.</p></li><li><h3>From exact dialogue quotes to feedback</h3><p>The plan is to separate the patient and feedback roles and provide feedback on questions based on exact quotes from the practice conversation.</p></li><li><h3>From the same case to another practice session</h3><p>After Claude integration, the plan is to keep each session tied to its case version and distinguish information not yet asked about, information the patient does not know and information not specified in the case, then use those distinctions to set the next practice goal.</p></li></ol></div></section><section class="project-identity" lang="en"><h2>Project summary</h2><div class="identity-body"><p>CPX Practice Lab is an independently developed Korean clinical-interview training workbench. It connects authored fictional cases, practice conversations, exact dialogue evidence and goal-based retries. Created by CHOI JUNHO; project started in February 2026. The current prototype uses authored responses; Claude integration is planned and is not live. For education only, not patient care. No clinical validation is claimed.</p></div></section><section class="project-identity"><h2>Records & guide</h2><div class="identity-body"><p>The current prototype uses authored case responses. Claude integration is planned and is not live.</p><p>Practice records are currently stored in this browser on this device and are not sent to an external server. There is no automatic synchronization. You can export cases, drafts, conversations and practice goals as JSON for safekeeping.</p></div></section><p>Enable JavaScript to use interview practice, case editing and records.</p></article></noscript></main><footer><span>Educational interview practice only. Not for patient care. No clinical validation is claimed.</span><span id="save-state"></span></footer><script type="module" src="./app.mjs"></script></body></html>
