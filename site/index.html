<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f5f1e7"><meta name="description" content="CPX Practice Lab은 자체 작성한 가상 증례로 한국어 문진을 연습하고, 대화 인용 근거를 복습하며, 목표를 정해 다시 연습하는 교육용 작업 공간입니다. CHOI JUNHO의 독립 제작 프로젝트 · 2026년 2월 시작."><link rel="icon" type="image/svg+xml" href="./assets/favicon.svg"><title>CPX Practice Lab · 증례에서 질문과 근거로</title><link rel="stylesheet" href="./style.css"><link rel="stylesheet" href="../guided-demo/style.css"><link rel="stylesheet" href="../project-front/style.css"></head><body><a class="skip" href="#main">본문으로 이동</a><header class="is-project-header"><a class="brand" href="#project">CPX Practice Lab</a><nav class="workbench-nav" aria-label="주 메뉴"><button data-nav="project">프로젝트</button><button data-nav="practice">연습</button><button data-nav="review">복습</button><button data-nav="editor">증례</button><button data-nav="about">기록·안내</button></nav><nav class="project-reviewer-nav" aria-label="프로젝트 안내"><a href="#overview">프로젝트</a><a href="#project-demo">시연</a><a href="#why-claude">Claude 계획</a><button data-nav="practice">직접 연습</button></nav><div class="locale-switch" aria-label="Language / 언어"><a data-language="en" lang="en" hreflang="en" href="../en/index.html">English</a><a data-language="ko" lang="ko" hreflang="ko" href="../site/index.html" aria-current="page">한국어</a></div></header><div id="notice" role="status" aria-live="polite"></div><main id="main" tabindex="-1"><noscript><style>header nav{display:none}</style><article class="project-page static-project" aria-label="프로젝트 소개"><h1>CPX Practice Lab</h1><p>CPX Practice Lab은 자체 작성한 가상 증례로 한국어 문진을 연습하고, 대화 인용 근거를 복습하며, 목표를 정해 다시 연습하는 교육용 작업 공간입니다.</p><section class="project-identity"><h2>현재 제공 흐름</h2><div class="identity-body"><p>창작 3증례 · 54개 사실 · 36개 질문 의도 · 108개 표현</p><p>증례 작성 → 문진 연습 → 대화 인용 근거 복습 → 목표 기반 재연습. 연습에 사용한 증례 버전을 유지하고, 증례·초안·대화·목표를 JSON으로 저장하거나 가져올 수 있습니다.</p></div></section><section class="project-identity"><h2>만드는 사람</h2><div class="identity-body"><h3>CHOI JUNHO</h3><p>Independent creator in South Korea</p><p>Project started February 2026</p><p>한국에서 CHOI JUNHO가 독립적으로 만드는 한국어 임상면담 연습 프로젝트입니다. 2026년 2월 시작한 프로젝트로, 증례 작성·문진 연습·인용 근거 복습을 하나의 흐름으로 연결합니다.</p></div></section><section class="project-identity"><h2>개발 계획</h2><div class="identity-body"><p>CLAUDE / PLANNED</p><p>다음 개발 단계는 Claude를 연결해 한국어 자연어 질문과 증례에 근거한 대화·복습을 잇는 것입니다.</p><ol class="identity-plan"><li><h3>한국어 질문에서 환자 답변으로</h3><p>한국어 자연어 질문의 의도를 파악하고, 선택한 증례에 작성된 사실의 범위 안에서 환자 답변을 생성할 계획입니다.</p></li><li><h3>실제 대화 인용에서 피드백으로</h3><p>환자 역할과 피드백 역할을 분리하고, 연습 중 실제로 오간 대화의 정확한 인용을 근거로 질문을 돌아보는 피드백을 제공할 계획입니다.</p></li><li><h3>같은 증례에서 다시 연습으로</h3><p>Claude 연동 후에도 연습에 사용한 증례 버전을 고정하고, 아직 묻지 않은 정보·환자가 모르는 정보·증례에 설정되지 않은 정보를 구분해 다음 연습 목표로 연결할 계획입니다.</p></li></ol></div></section><section class="project-identity" lang="en"><h2>Project summary</h2><div class="identity-body"><p>CPX Practice Lab is an independently developed Korean clinical-interview training workbench. It connects authored fictional cases, practice conversations, exact dialogue evidence and goal-based retries. Created by CHOI JUNHO; project started in February 2026. Claude integration is the next development step.</p></div></section><section class="project-identity"><h2>기록·안내</h2><div class="identity-body"><p>현재는 작성된 증례 응답으로 연습하며 Claude 연동은 개발 중입니다.</p><p>현재 연습 기록은 이 브라우저의 이 기기에 저장되며 외부 서버로 전송되지 않습니다. 자동 동기화는 사용하지 않습니다. 증례, 초안, 대화와 연습 목표는 JSON으로 내보내 보관할 수 있습니다.</p></div></section><p>문진 연습·증례 편집·기록 기능을 사용하려면 JavaScript를 켜 주세요.</p></article></noscript></main><footer><span>교육용 문진 연습 노트</span><span id="save-state"></span></footer><script type="module" src="./app.mjs"></script></body></html>
